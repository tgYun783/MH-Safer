name: 백로그 항목
description: 스프린트 백로그 항목 1개 (docs/sprints/sprint-N.md와 같은 ID)
title: "[S?-??] "
labels: ["backlog"]
body:
  - type: input
    id: id
    attributes:
      label: ID
      description: "S<스프린트>-<번호>. docs/sprints/sprint-N.md 표와 같게"
      placeholder: S3-01
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: 담당
      options: [윤태건, 우진, 전유정]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 선택 항목은 필수를 다 끝낸 뒤에만
      options: [필수, 선택]
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: 추정 (h)
      description: 8h를 넘으면 쪼갠다
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 숫자나 예/아니오로 확인할 수 있게. 확인 방법(명령·테스트 이름)도 적는다
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 선행·의존
      description: 먼저 끝나야 하는 항목, 스택 PR이면 머지 순서
